services:
  database:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
    # Stores PostgreSQL data permanently, so data is not lost when the container stops
      - postgres_data:/var/lib/postgresql/data
    # Runs SQL initialization files from the local ./sql folder

      - ./sql:/docker-entrypoint-initdb.d

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      
  pipeline:
    image: raalshat21/temperature-image:v2 
    depends_on:
      - database
    volumes:
      - ./data/raw:/app/data/raw
      - ./model:/app/model
    env_file:
      - .env
    command: python -m src.run_pipeline
  prediction:
    image: raalshat21/temperature-image:v3
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn src.api.prediction:app --host 0.0.0.0 --port 8000

  worker:
    image: raalshat21/temperature-image:v3 
    depends_on:
        - database
        - redis
        - rabbitmq
    env_file:
      - .env
    volumes:
      - ./model:/app/model
    command: python -m src.worker.prediction_worker  


volumes:
  postgres_data: